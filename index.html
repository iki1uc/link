<script type="module">
import { LINK_BOOT } from "./link-bootstrap.js";

window.startShow = async () => {

  const result = await LINK_BOOT.start();

  document.getElementById("qiOut").innerText =
    JSON.stringify(result.jb, null, 2);

  document.getElementById("iqqOut").innerText =
    JSON.stringify(result.pc, null, 2);

  document.getElementById("octaOut").innerText =
    JSON.stringify(result.pq, null, 2);

  document.getElementById("connectOut").innerText =
    JSON.stringify(result.connectInit, null, 2);

  document.getElementById("syncOut").innerText =
    result.syncInit;
};
</script>
